name: "🐞 Bug报告"
description: 创建一个报告来帮助我们改进产品
title: '[Bug]: '
type: 'Bug'
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        **在开始之前...**

        此表单仅用于提交Bug报告。如果您有使用问题或不确定这是否真的是一个Bug，请确保：

        - 阅读[文档](https://music.moekoe.cn/)
        - 检查 [Issue Tracker](https://github.com/MoeKoeMusic/MoeKoeMusic/issues?q=is%3Aissue) 和 [Discussions](https://github.com/orgs/MoeKoeMusic/discussions?discussions_q=) 是否有类似的问题 - 它可能已经被回答或修复
        - 提供有效的 Bug 描述和明确的问题内容，否则 issue 将可能被直接关闭或忽略处理

        如果您发现一个旧的、已关闭的问题在最新版本中仍然存在，请继续使用下面的表单打开一个新问题。
  - type: checkboxes
    id: terms
    attributes:
      label: 请确保您已阅读以上注意事项，并勾选下方的确认框。
      options:
        - label: 我已知晓并同意，如果我不按照模板提供的指示进行填写，则我的 Issue 可能会被无条件关闭/锁定。
          required: true
        - label: 我已使用一个全新安装的最新版本 MoeKoe Music，问题依旧存在。
          required: true
        - label: 我已在 [Issue Tracker](https://github.com/MoeKoeMusic/MoeKoeMusic/issues?q=is%3Aissue) 和 [Discussions](https://github.com/orgs/MoeKoeMusic/discussions?discussions_q=) 中找过我要提出的问题，没有找到类似 Issue 或 Discussion。
          required: true
        - label: （可选）我找到了类似的 Issue 或 Discussion，但问题仍然存在
        - label: 我已知晓并同意，此处仅用于汇报 MoeKoe Music 中存在的问题，否则我的 Issue 可能会被无条件关闭/锁定。
          required: true
  - type: input
    id: version
    attributes:
      label: 产品版本
      placeholder: 例如：@ MoeKoe Music V1.4.3
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 设备平台
      description: 选择 MoeKoe Music 运行在哪种平台
      options:
        - Windows
        - Linux （请在系统信息部分中说明发行版）
        - MacOS
        - Docker / Web
        - 其它（请在系统信息部分中说明）
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 复现步骤
      description: |
        我们需要做什么才能复现这个bug？请提供清晰简洁的复现说明，这对我们及时分类您的问题很重要。
      placeholder: |
        1. 打开...
        2. 点击...
        3. 滚动到...
        4. 查看错误
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 您期望看到什么？
    validations:
      required: true
  - type: textarea
    id: actually-happening
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: system-info
    attributes:
      label: 系统信息（可选）
      description: 操作系统、网络环境、设备等
      placeholder: |
        - 操作系统: [例如 Windows 10, macOS 12.0, Ubuntu 24.04]
        - 网络环境: [例如 中国, 日本, 移动, WiFi]
        - 设备信息: [例如 笔记本, GTX1060, 16G, 台式机]
  - type: textarea
    id: logs
    attributes:
      label: 日志（可选）
      description: |
        添加日志以便于我们能更好的定位问题
        - 如果是 Docker 镜像或 Web 端：
          按 <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>I</kbd> （或 <kbd>F12</kbd>）打开浏览器开发人员工具
          切换到“控制台（Console）”选项卡，截图错误信息
        - 如果是客户端：
          在 头像-设置-系统-日志 中导出日志
  - type: textarea
    id: additional-comments
    attributes:
      label: 其他补充说明（可选）
      description: 例如：一些关于您如何遇到这个bug的背景/上下文。